<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impact Dashboard - CivicConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
      <h1 class="text-xl font-bold text-blue-600">CivicConnect</h1>
      <ul class="flex space-x-6">
        <li><a href="index.html" class="hover:text-blue-600">Community Feed</a></li>
        <li><a href="dashboard.html" class="text-blue-600 font-semibold">Authority Dashboard</a></li>
        <li><a href="success.html" class="hover:text-blue-600">Success Stories</a></li>
      </ul>
    </div>
  </nav>

  <!-- Dashboard -->
  <div class="max-w-5xl mx-auto mt-10 px-4">
    <h2 class="text-2xl font-bold mb-6">Authority Dashboard</h2>
    <table class="w-full bg-white rounded-lg shadow">
      <thead class="bg-gray-100">
        <tr>
          <th class="text-left px-4 py-2">Issue</th>
          <th class="text-left px-4 py-2">Location</th>
          <th class="text-left px-4 py-2">Department</th>
          <th class="text-left px-4 py-2">Status</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-t">
          <td class="px-4 py-2">Graffiti vandalism</td>
          <td class="px-4 py-2">Community Center</td>
          <td class="px-4 py-2">Sanitation</td>
          <td class="px-4 py-2">
            <select class="border px-2 py-1 rounded">
              <option>Reported</option>
              <option>In Progress</option>
              <option>Resolved</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
