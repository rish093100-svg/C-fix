<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signup Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create an Account</h2>
    
    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your name" required
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input type="password" id="confirm_password" placeholder="Re-enter password" required
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 focus:outline-none" />
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account? <a href="login.html" class="text-blue-600 hover:underline">Login</a>
    </p>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let name = document.getElementById("fullname").value;
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;
      let confirmPassword = document.getElementById("confirm_password").value;

      if (password !== confirmPassword) {
        alert("Passwords do not match! Please re-enter.");
        return;
      }

      let user = { name, email, password };
      localStorage.setItem("user", JSON.stringify(user));

      // Login the user immediately after signup
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("username", name);

      alert("Signup successful! 🎉 You are now logged in.");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
