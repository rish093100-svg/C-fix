<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login to Your Account</h2>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 focus:outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required
          class="mt-1 block w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300 focus:outline-none" />
      </div>

      <button type="submit" class="w-full bg-green-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-green-700 transition">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Don’t have an account? <a href="signup.html" class="text-blue-600 hover:underline">Sign Up</a>
    </p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let email = document.getElementById("loginEmail").value;
      let password = document.getElementById("loginPassword").value;

      let savedUser = JSON.parse(localStorage.getItem("user"));

      if (!savedUser) {
        alert("No account found. Please sign up first.");
        window.location.href = "signup.html";
        return;
      }

      if (email === savedUser.email && password === savedUser.password) {
        alert("Login successful! 🎉 Welcome " + savedUser.name);

        localStorage.setItem("isLoggedIn", "true");
        localStorage.setItem("username", savedUser.name);

        window.location.href = "index.html";
      } else {
        alert("Invalid email or password. Please try again.");
      }
    });
  </script>
</body>
</html>
